<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">KKB audio system architecture</title>
  <desc id="desc">Current architecture for apps/web audio code, packages/audio runtime modules, and shared UI components.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 34px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 400 18px Arial, sans-serif; }
      .group-title { fill: #0f172a; font: 700 22px Arial, sans-serif; }
      .group-note { fill: #64748b; font: 400 14px Arial, sans-serif; }
      .box-title { fill: #0f172a; font: 700 16px Arial, sans-serif; }
      .box-text { fill: #1e293b; font: 400 14px Arial, sans-serif; }
      .small { fill: #475569; font: 600 13px Arial, sans-serif; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 20; }
      .web { fill: #eff6ff; stroke: #93c5fd; }
      .audio { fill: #ecfdf5; stroke: #86efac; }
      .ui { fill: #fff7ed; stroke: #fdba74; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .node-blue { fill: #dbeafe; stroke: #60a5fa; }
      .node-green { fill: #dcfce7; stroke: #22c55e; }
      .node-amber { fill: #ffedd5; stroke: #fb923c; }
      .node-muted { fill: #f1f5f9; stroke: #94a3b8; }
      .line { fill: none; stroke: #3b82f6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .line-green { fill: none; stroke: #10b981; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .line-amber { fill: none; stroke: #f59e0b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="1180" />
  <text class="title" x="70" y="70">KKB audio implementation architecture</text>
  <text class="subtitle" x="70" y="101">Current repo shape as of 2026-04-23: web owns browser orchestration, @kkb/audio owns headless runtime, @kkb/ui owns shared presentation pieces.</text>

  <rect class="group web" x="60" y="145" width="465" height="930" rx="24" />
  <text class="group-title" x="90" y="185">apps/web</text>
  <text class="group-note" x="90" y="210">Next.js host: browser objects, app state, routes, lifecycle</text>

  <rect class="node node-blue" x="90" y="245" width="405" height="92" rx="12" />
  <text class="box-title" x="112" y="274">/audio route</text>
  <text class="box-text" x="112" y="298">app/audio/page.tsx</text>
  <text class="box-text" x="112" y="318">renders PlayerClient</text>

  <rect class="node" x="90" y="365" width="190" height="112" rx="12" />
  <text class="box-title" x="112" y="394">PlayerClient</text>
  <text class="box-text" x="112" y="418">creates catalog</text>
  <text class="box-text" x="112" y="438">creates WebPlayer</text>
  <text class="box-text" x="112" y="458">creates controller</text>

  <rect class="node" x="305" y="365" width="190" height="112" rx="12" />
  <text class="box-title" x="327" y="394">PlayerShell</text>
  <text class="box-text" x="327" y="418">timeline rAF loop</text>
  <text class="box-text" x="327" y="438">buffered ranges</text>
  <text class="box-text" x="327" y="458">transport callbacks</text>

  <rect class="node" x="90" y="505" width="190" height="112" rx="12" />
  <text class="box-title" x="112" y="534">Static catalog</text>
  <text class="box-text" x="112" y="558">AAC fixture</text>
  <text class="box-text" x="112" y="578">Opus fixture</text>
  <text class="box-text" x="112" y="598">default track id</text>

  <rect class="node" x="305" y="505" width="190" height="112" rx="12" />
  <text class="box-title" x="327" y="534">PlayerController</text>
  <text class="box-text" x="327" y="558">selection state</text>
  <text class="box-text" x="327" y="578">queue flags</text>
  <text class="box-text" x="327" y="598">runtime snapshot</text>

  <rect class="node node-blue" x="90" y="660" width="405" height="92" rx="12" />
  <text class="box-title" x="112" y="689">/oscilloscope route</text>
  <text class="box-text" x="112" y="713">app/oscilloscope/page.tsx</text>
  <text class="box-text" x="112" y="733">renders OscilloscopeClient</text>

  <rect class="node" x="90" y="780" width="190" height="130" rx="12" />
  <text class="box-title" x="112" y="809">OscilloscopeClient</text>
  <text class="box-text" x="112" y="833">support check</text>
  <text class="box-text" x="112" y="853">hash config</text>
  <text class="box-text" x="112" y="873">lazy runtime import</text>
  <text class="box-text" x="112" y="893">mic request guard</text>

  <rect class="node" x="305" y="780" width="190" height="130" rx="12" />
  <text class="box-title" x="327" y="809">Oscilloscope UI</text>
  <text class="box-text" x="327" y="833">Shell + Controls</text>
  <text class="box-text" x="327" y="853">canvas ref</text>
  <text class="box-text" x="327" y="873">preset/source/freq</text>
  <text class="box-text" x="327" y="893">trail + bloom</text>

  <rect class="node" x="90" y="940" width="405" height="92" rx="12" />
  <text class="box-title" x="112" y="969">createMicProvider</text>
  <text class="box-text" x="112" y="993">getUserMedia + AudioContext + AnalyserNodes</text>
  <text class="box-text" x="112" y="1013">fake mono/stereo modes for test and demo</text>

  <rect class="group audio" x="570" y="145" width="620" height="930" rx="24" />
  <text class="group-title" x="600" y="185">@kkb/audio</text>
  <text class="group-note" x="600" y="210">Headless package: no root barrel, only subpath exports</text>

  <rect class="node node-green" x="600" y="245" width="250" height="122" rx="12" />
  <text class="box-title" x="622" y="274">contracts</text>
  <text class="box-text" x="622" y="298">TrackInput</text>
  <text class="box-text" x="622" y="318">TimelineSnapshot</text>
  <text class="box-text" x="622" y="338">SourceCapabilities</text>

  <rect class="node node-green" x="900" y="245" width="250" height="122" rx="12" />
  <text class="box-title" x="922" y="274">AudioEngine</text>
  <text class="box-text" x="922" y="298">source ranking/load</text>
  <text class="box-text" x="922" y="318">PlayerStore</text>
  <text class="box-text" x="922" y="338">PlaybackCheckpoint</text>

  <rect class="node" x="600" y="402" width="250" height="174" rx="12" />
  <text class="box-title" x="622" y="431">sources</text>
  <text class="box-text" x="622" y="455">WebCodecsSource score 100</text>
  <text class="box-text" x="622" y="475">MediaElementSource score 70</text>
  <text class="box-text" x="622" y="495">WorkletPCMSource score 50</text>
  <text class="box-text" x="622" y="515">FallbackSource score 1</text>
  <text class="small" x="622" y="545">media + fallback share HTMLAudio adapter</text>

  <rect class="node" x="900" y="402" width="250" height="174" rx="12" />
  <text class="box-title" x="922" y="431">worklet + metrics</text>
  <text class="box-text" x="922" y="455">registerWorklet()</text>
  <text class="box-text" x="922" y="475">postmessage queue</text>
  <text class="box-text" x="922" y="495">SAB ring buffer</text>
  <text class="box-text" x="922" y="515">createMetrics()</text>
  <text class="small" x="922" y="545">primitives, not wired into host yet</text>

  <rect class="node node-green" x="600" y="628" width="250" height="132" rx="12" />
  <text class="box-title" x="622" y="657">Oscilloscope runtime</text>
  <text class="box-text" x="622" y="681">createOscilloscope()</text>
  <text class="box-text" x="622" y="701">RAF loop</text>
  <text class="box-text" x="622" y="721">config merge</text>
  <text class="box-text" x="622" y="741">active SignalProvider</text>

  <rect class="node" x="900" y="628" width="250" height="132" rx="12" />
  <text class="box-title" x="922" y="657">Signal + modes</text>
  <text class="box-text" x="922" y="681">Oscillator provider</text>
  <text class="box-text" x="922" y="701">Analyser provider</text>
  <text class="box-text" x="922" y="721">XY mode geometry</text>
  <text class="box-text" x="922" y="741">presets + support check</text>

  <rect class="node" x="600" y="810" width="550" height="160" rx="12" />
  <text class="box-title" x="622" y="839">WebGPU renderer</text>
  <text class="box-text" x="622" y="863">createWebGpuRenderer(canvas)</text>
  <text class="box-text" x="622" y="883">history texture persists phosphor trails</text>
  <text class="box-text" x="622" y="903">fade pass -> trace pass -> composite pass</text>
  <text class="box-text" x="622" y="923">uniforms use config + deltaSeconds</text>
  <text class="small" x="622" y="953">renderer owns GPU resources; runtime owns frame scheduling</text>

  <rect class="group ui" x="1235" y="245" width="305" height="410" rx="24" />
  <text class="group-title" x="1265" y="285">@kkb/ui</text>
  <text class="group-note" x="1265" y="310">Shared presentation, no engine ownership</text>

  <rect class="node node-amber" x="1265" y="345" width="245" height="82" rx="12" />
  <text class="box-title" x="1287" y="374">PlayerControls</text>
  <text class="box-text" x="1287" y="398">transport, rate, volume</text>

  <rect class="node node-amber" x="1265" y="455" width="245" height="82" rx="12" />
  <text class="box-title" x="1287" y="484">SeekTimeline</text>
  <text class="box-text" x="1287" y="508">seek target, progress refs</text>

  <rect class="node node-amber" x="1265" y="565" width="245" height="62" rx="12" />
  <text class="box-title" x="1287" y="594">createPlayerPresenter</text>

  <path class="line" d="M495 561 C585 561, 720 360, 900 336" />
  <text class="small" x="520" y="648">player facade delegates</text>
  <path class="line" d="M495 845 C545 845, 560 690, 600 690" />
  <text class="small" x="515" y="864">lazy scope runtime</text>
  <path class="line" d="M495 986 C615 986, 760 740, 900 720" />
  <text class="small" x="560" y="1010">mic provider injection</text>
  <path class="line-amber" d="M495 421 C820 421, 1000 386, 1265 386" />
  <text class="small" x="1085" y="372">shared controls</text>
  <path class="line-amber" d="M495 438 C820 465, 1000 496, 1265 496" />
  <text class="small" x="1095" y="482">seek timeline</text>
  <path class="line-green" d="M850 695 L900 695" />
  <path class="line-green" d="M850 306 L900 306" />
  <path class="line-green" d="M1025 367 L1025 402" />
  <path class="line-green" d="M725 760 L725 810" />
  <path class="line-green" d="M1025 760 L1025 810" />

  <rect class="node node-muted" x="1235" y="720" width="305" height="172" rx="12" />
  <text class="box-title" x="1262" y="751">Boundary rule</text>
  <text class="box-text" x="1262" y="779">apps/web creates browser APIs:</text>
  <text class="box-text" x="1262" y="799">Audio(), AudioContext, getUserMedia,</text>
  <text class="box-text" x="1262" y="819">canvas refs, React state.</text>
  <text class="box-text" x="1262" y="849">@kkb/audio stays browser-headless</text>
  <text class="box-text" x="1262" y="869">except explicit runtime adapters.</text>

  <text class="small" x="70" y="1135">Diagram source: packages/audio/src plus apps/web audio and oscilloscope files, verified by repo scan and subagent exploration.</text>
</svg>
